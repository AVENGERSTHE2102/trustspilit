[project]
name = "trustsplit"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3", "anthropic>=0.40,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2"]

[project.optional-dependencies]
